<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-1: #3b82f6;
            --accent-2: #8b5cf6;
            --accent-3: #ec4899;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            cursor: none; /* Hide default cursor for custom one */
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        /* Animated Background */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            filter: blur(80px);
            opacity: 0.6;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
            opacity: 0.8;
        }

        .orb-1 {
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, var(--accent-1), transparent 70%);
            top: -20%;
            left: -10%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--accent-2), transparent 70%);
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, var(--accent-3), transparent 70%);
            top: 40%;
            left: 40%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Content Styling */
        .content {
            text-align: center;
            z-index: 2;
            backdrop-filter: blur(10px);
            padding: 3rem 4rem;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: fadeIn 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .content:hover {
            transform: translateY(0) scale(1.02);
            box-shadow: 0 35px 60px -15px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 6rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -3px;
            line-height: 1.1;
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.2));
        }

        p {
            font-size: 1.25rem;
            font-weight: 300;
            margin-top: 1rem;
            color: rgba(248, 250, 252, 0.8);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Custom Cursor */
        .cursor-follower {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -50%);
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        height 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        background-color 0.4s,
                        border-color 0.4s;
            mix-blend-mode: difference;
        }

        .cursor-dot {
            position: fixed;
            width: 4px;
            height: 4px;
            background-color: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 101;
            transform: translate(-50%, -50%);
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 3.5rem; }
            p { font-size: 1rem; }
            .content { padding: 2rem; }
            /* Restore default cursor on mobile */
            body, html { cursor: auto; }
            .cursor-follower, .cursor-dot { display: none; }
        }
    </style>
</head>
<body>

    <div class="background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <div class="content">
            <h1>Hello World</h1>
            <p>Welcome to the digital frontier</p>
        </div>
    </div>

    <div class="cursor-follower" id="cursor-follower"></div>
    <div class="cursor-dot" id="cursor-dot"></div>

    <script>
        const follower = document.getElementById('cursor-follower');
        const dot = document.getElementById('cursor-dot');
        const content = document.querySelector('.content');

        // Smooth cursor movement
        let mouseX = 0, mouseY = 0;
        let followerX = 0, followerY = 0;
        let dotX = 0, dotY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            // Lerp (Linear Interpolation) for smooth following
            followerX += (mouseX - followerX) * 0.1;
            followerY += (mouseY - followerY) * 0.1;
            
            // Dot moves faster/instantly
            dotX = mouseX;
            dotY = mouseY;

            follower.style.left = followerX + 'px';
            follower.style.top = followerY + 'px';
            
            dot.style.left = dotX + 'px';
            dot.style.top = dotY + 'px';

            requestAnimationFrame(animateCursor);
        }

        animateCursor();

        // Hover effects
        content.addEventListener('mouseenter', () => {
            follower.style.width = '80px';
            follower.style.height = '80px';
            follower.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
            follower.style.border = 'none';
        });

        content.addEventListener('mouseleave', () => {
            follower.style.width = '20px';
            follower.style.height = '20px';
            follower.style.backgroundColor = 'transparent';
            follower.style.border = '2px solid rgba(255, 255, 255, 0.5)';
        });

        // Click effect
        document.addEventListener('mousedown', () => {
            follower.style.transform = 'translate(-50%, -50%) scale(0.8)';
        });

        document.addEventListener('mouseup', () => {
            follower.style.transform = 'translate(-50%, -50%) scale(1)';
        });
    </script>
</body>
</html>
